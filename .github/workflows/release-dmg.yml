name: Release DMG

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the DMG filename (e.g. 0.1.1). Leave empty to use Cargo.toml."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.release.tag_name }}" ]]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Build DMG
        env:
          PDF_OPENER_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x packaging/make-icon.sh packaging/build-dmg.sh
          ./packaging/build-dmg.sh
          ls -lh dist/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Opener-${{ steps.ver.outputs.version }}-macos
          path: dist/PDF-Opener-*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}"
          DMG=$(ls dist/PDF-Opener-*.dmg | head -1)

          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
            echo "Uploaded $DMG to existing release $TAG"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated macOS DMG build for Small Rust PDF Opener." \
              --verify-tag \
              "$DMG"
            echo "Created release $TAG with $DMG"
          else
            echo "No release named $TAG — DMG kept as workflow artifact only."
          fi
